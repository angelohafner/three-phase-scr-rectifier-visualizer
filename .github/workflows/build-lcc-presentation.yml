name: Build advanced offline LCC presentation (HTML only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'presentation/**'
      - 'rectifier_*.py'
      - 'schemdraw_symbols.py'
      - 'current_source*.py'
      - 'lcc_converter.py'
      - 'halfwave_*.py'
      - 'lcc_advanced_*.py'
      - 'hvdc_link*.py'
      - 'output_lcc/**'
      - 'output_hvdc/**'
      - '.github/workflows/build-lcc-presentation.yml'
permissions:
  contents: read
jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install model and graphics dependencies
        run: |
          python -m pip install -r requirements-waveforms.txt pytest pillow playwright lxml "schemdraw>=0.22,<0.24"
          python -m playwright install --with-deps chromium
      - name: Verify native Schemdraw elements
        run: |
          python -c "import schemdraw.elements as elm; assert all(hasattr(elm, name) for name in ('SCR','ResistorIEEE','Inductor','SourceSin','SourceV','SourceI'))"
      - name: Regenerate six-pulse rectifier and inverter SVG galleries
        run: python lcc_converter.py --side both --alpha 145 --mu 15 --output-dir output_lcc
      - name: Regenerate full HVDC circuit SVG and PNG galleries
        run: python hvdc_link.py --config config_hvdc.json --all --output-dir output_hvdc --png
      - name: Build editable LE and RLE circuit diagrams and waveforms
        run: python lcc_advanced_figures.py --output-dir output_lcc/rectifier/advanced_loads
      - name: Generate half-wave R/RL teaching figures
        run: python halfwave_figures.py --output-dir output_lcc/fundamentals
      - name: Build ideal current-source teaching diagrams and waveforms
        run: python current_source_figures.py --out output_lcc/current_source
      - name: Build standalone offline HTML
        run: python presentation/build_presentation.py --project . --output dist/lcc_hvdc_interactive.html
      - name: Syntax validation
        run: |
          for source in presentation/src/*.js; do node --check "$source"; done
      - name: Test physical models and presentation
        run: REQUIRE_NATIVE_SCHEMDRAW=1 python -m pytest -q tests presentation/tests
      - name: Verify interactive HTML in offline Chromium
        run: |
          python presentation/tests/browser_smoke.py
          python presentation/tests/browser_fundamentals.py
          python presentation/tests/browser_inductor_controls.py
          python presentation/tests/browser_current_source.py
      - name: Upload native Schemdraw SVG gallery
        uses: actions/upload-artifact@v4
        with:
          name: lcc-native-schemdraw-svg-gallery
          path: |
            output_lcc/fundamentals/circuits/*.svg
            output_lcc/rectifier/*.svg
            output_lcc/inverter/*.svg
            output_hvdc/*.svg
            output_lcc/current_source/rectifier/circuits/*.svg
            output_lcc/current_source/inverter/circuits/*.svg
            output_lcc/current_source/rectifier/waveforms/*.svg
          retention-days: 90
      - name: Upload HTML-only deliverable
        uses: actions/upload-artifact@v4
        with:
          name: lcc-hvdc-thyristor-fundamentals-html
          path: dist/lcc_hvdc_interactive.html
          retention-days: 90
