name: Build advanced LCC presentation (HTML only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'presentation/**'
      - 'rectifier_*.py'
      - 'schemdraw_symbols.py'
      - 'lcc_converter.py'
      - 'halfwave_*.py'
      - 'lcc_advanced_*.py'
      - 'hvdc_link*.py'
      - 'output_lcc/**'
      - 'output_hvdc/**'
      - '.github/workflows/build-lcc-presentation.yml'
permissions:
  contents: read
jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install model and graphics dependencies
        run: |
          python -m pip install -r requirements-waveforms.txt pytest pillow playwright "schemdraw>=0.22,<0.24"
          python -m playwright install --with-deps chromium
      - name: Verify native Schemdraw components
        run: |
          python -c "import schemdraw.elements as elm; assert all(hasattr(elm, name) for name in ('SCR','ResistorIEEE','Inductor','SourceSin','SourceV'))"
      - name: Regenerate rectifier and inverter SVGs
        run: python lcc_converter.py --side both --alpha 145 --mu 15 --output-dir output_lcc
      - name: Regenerate full HVDC SVGs and PNGs
        run: python hvdc_link.py --config config_hvdc.json --all --output-dir output_hvdc --png
      - name: Regenerate advanced LE/RLE circuits
        run: python lcc_advanced_figures.py --output-dir output_lcc/rectifier/advanced_loads
      - name: Generate half-wave R/RL diagrams
        run: python halfwave_figures.py --output-dir output_lcc/fundamentals
      - name: Build the standalone offline HTML
        run: python presentation/build_presentation.py --project . --output dist/lcc_hvdc_interactive.html
      - name: Validate JavaScript syntax
        run: |
          for source in presentation/src/*.js; do node --check "$source"; done
      - name: Run model, SVG and presentation tests
        run: REQUIRE_NATIVE_SCHEMDRAW=1 python -m pytest -q tests presentation/tests
      - name: Test interactive HTML in offline Chromium
        run: |
          python presentation/tests/browser_smoke.py
          python presentation/tests/browser_fundamentals.py
          python presentation/tests/browser_inductor_controls.py
          python presentation/tests/browser_no_inductor_voltage.py
      - name: Upload native Schemdraw SVG figures
        uses: actions/upload-artifact@v4
        with:
          name: lcc-native-schemdraw-svg-gallery
          path: |
            output_lcc/fundamentals/circuits/*.svg
            output_lcc/rectifier/*.svg
            output_lcc/inverter/*.svg
            output_hvdc/*.svg
          retention-days: 90
      - name: Upload standalone HTML presentation
        uses: actions/upload-artifact@v4
        with:
          name: lcc-hvdc-thyristor-fundamentals-html
          path: dist/lcc_hvdc_interactive.html
          retention-days: 90
