name: Build offline LCC presentation
on:
  workflow_dispatch:
  push:
    paths:
      - 'presentation/**'
      - 'rectifier_*.py'
      - 'hvdc_link*.py'
      - 'output_lcc/**'
      - 'output_hvdc/**'
      - 'docs/RECTIFIER_R_RL_TEACHING.md'
      - '.github/workflows/build-lcc-presentation.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-waveforms.txt pytest playwright pillow
          python -m playwright install --with-deps chromium
      - name: Generate R and RL diagrams and waveforms
        run: python rectifier_loads.py
      - name: Build the self-contained HTML
        run: python presentation/build_presentation.py --project . --output dist/lcc_hvdc_interactive.html
      - name: Run model and HTML source tests
        run: python -m pytest -q tests presentation/tests
      - name: Generate Python SCR A-K waveform figures
        run: python rectifier_load_extended.py --out output_lcc/extended
      - name: Check JavaScript syntax
        run: |
          for source in presentation/src/*.js; do node --check "$source"; done
      - name: Verify HTML in offline Chromium
        run: python presentation/tests/browser_smoke.py
      - name: Upload standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: lcc-hvdc-interactive-R-RL-LE-RLE
          path: dist/lcc_hvdc_interactive.html
          retention-days: 90
